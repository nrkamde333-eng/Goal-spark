<!doctype html>
<html lang="en" class="dark h-screen w-screen">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Goal Spark AI — AI Goal Planner & Smart Calendar</title>
    <meta
      name="description"
      content="Turn ambitious goals into daily action. AI planner, calendar, tasks, habits and analytics in one focused workspace."
    />
    <meta
      property="og:title"
      content="Goal Spark AI — AI Goal Planner & Smart Calendar"
    />
    <meta
      property="og:description"
      content="Plan smarter. Achieve faster. Your AI productivity coach."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400;1,6..72,500;1,6..72,600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
    />
  </head>
  <body
    class="bg-background text-foreground m-0 p-0"
    style="background-color: #0f121d; color: #f8fafc; margin: 0; padding: 0"
  >
    <div id="root">
      <div
        style="
          min-height: 100vh;
          width: 100vw;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background-color: #0f121d;
          color: #f8fafc;
          font-family:
            -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto,
            sans-serif;
        "
      >
        <div
          style="
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
          "
        >
          <div
            style="
              width: 28px;
              height: 28px;
              border: 3px solid rgba(255, 255, 255, 0.1);
              border-top-color: #8b5cf6;
              border-radius: 50%;
              animation: spin 0.8s linear infinite;
            "
          ></div>
          <span
            style="font-weight: 700; font-size: 1.1rem; letter-spacing: -0.02em"
            >Goal Spark AI</span
          >
        </div>
        <p style="color: #94a3b8; font-size: 0.875rem; margin: 0">
          Loading your productivity workspace...
        </p>
        <style>
          @keyframes spin {
            to {
              transform: rotate(360deg);
            }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
